name: bank-agent
services:
  db:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run setup.ps1 first}
      FINERACT_DB_PASSWORD: ${FINERACT_DB_PASSWORD:?Run setup.ps1 first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-fineract.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
  storage-init:
    image: postgres:18.3
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /files"]
    volumes:
      - fineract_files:/files
  fineract:
    image: ${FINERACT_IMAGE:-apache/fineract:latest}
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      FINERACT_NODE_ID: "1"
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: fineract
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASSWORD}
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: fineract
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASSWORD}
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Asia/Shanghai
      FINERACT_DEFAULT_TENANTDB_MASTER_PASSWORD: ${FINERACT_MASTER_PASSWORD}
      FINERACT_SERVER_SSL_ENABLED: "true"
      FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE: health,info
      FINERACT_REMOTE_JOB_MESSAGE_HANDLER_SPRING_EVENTS_ENABLED: "true"
      FINERACT_CONTENT_FILESYSTEM_ROOT_FOLDER: /tmp/fineract-files
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g -Duser.timezone=UTC
    volumes:
      - fineract_files:/tmp/fineract-files
volumes:
  postgres_data:
  fineract_files:
